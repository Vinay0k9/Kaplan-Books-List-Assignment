services:
  backend:
    build:
      context: ./backend
    container_name: books-list-backend
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/books:/app/books
      - ./backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: books-list-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
